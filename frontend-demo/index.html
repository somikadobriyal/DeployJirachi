<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudForge Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-alt: #eef3f8;
      --text: #17212b;
      --muted: #64748b;
      --border: #d9e2ec;
      --accent: #087f78;
      --accent-strong: #06645f;
      --accent-text: #ffffff;
      --success: #16803c;
      --warning: #a16207;
      --danger: #c02626;
      --terminal: #0b1220;
      --terminal-text: #d6e1ed;
      --shadow: 0 8px 24px rgba(15, 23, 42, .06);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d141c;
      --surface: #151f2b;
      --surface-alt: #1c2a38;
      --text: #e8eef5;
      --muted: #9aabbd;
      --border: #2b3b4d;
      --accent: #43c0b6;
      --accent-strong: #70d4cc;
      --accent-text: #06201f;
      --success: #4ade80;
      --warning: #facc15;
      --danger: #f87171;
      --terminal: #080d14;
      --terminal-text: #d2deea;
      --shadow: 0 10px 30px rgba(0, 0, 0, .2);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 2px;
    }
    .container { max-width: 1160px; margin: auto; padding: 28px 18px 56px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .brand { margin: 0; font-size: 24px; letter-spacing: -.03em; }
    .spacer { flex: 1; }
    .connection { color: var(--muted); font-size: 13px; }
    .connection.online { color: var(--success); }
    .connection.offline { color: var(--danger); }
    .layout { display: grid; grid-template-columns: minmax(280px, .82fr) minmax(0, 1.6fr); gap: 18px; }
    .stack { display: grid; gap: 18px; align-content: start; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
    .card-title { margin: 0 0 14px; font-size: 17px; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
    input { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 10px 11px; background: var(--surface-alt); color: var(--text); }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; }
    button { border: 1px solid var(--border); border-radius: 9px; padding: 8px 13px; background: var(--surface); color: var(--text); transition: .18s ease; }
    button:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
    button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-text); font-weight: 700; }
    button.danger { color: var(--danger); }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .error { min-height: 18px; color: var(--danger); font-size: 13px; }
    .hint, .empty { color: var(--muted); font-size: 13px; }
    .app-list { display: grid; gap: 8px; }
    .app { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; text-align: left; background: var(--surface-alt); }
    .app[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .app-name { display: block; font-weight: 700; }
    .app-meta { display: block; color: var(--muted); font-size: 12px; }
    .dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--muted); }
    .dot.HEALTHY { background: var(--success); }
    .dot.FAILED { background: var(--danger); }
    .dot.QUEUED, .dot.BUILDING, .dot.STARTING { background: var(--warning); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .detail-head h2 { margin: 0; font-size: 19px; overflow-wrap: anywhere; }
    .status { border: 1px solid currentColor; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700; }
    .status.HEALTHY { color: var(--success); } .status.FAILED { color: var(--danger); }
    .status.QUEUED, .status.BUILDING, .status.STARTING { color: var(--warning); }
    .status.STOPPED { color: var(--muted); }
    .stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 16px 0; }
    .stage { padding: 7px 3px; border: 1px solid var(--border); border-radius: 7px; color: var(--muted); font-size: 12px; text-align: center; }
    .stage.done { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
    .stage.current { border-color: var(--warning); color: var(--warning); font-weight: 700; }
    .stage.failed { border-color: var(--danger); color: var(--danger); font-weight: 700; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat { min-width: 0; padding: 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-alt); }
    .stat-label { display: block; color: var(--muted); font-size: 12px; }
    .stat-value { display: block; margin-top: 3px; overflow-wrap: anywhere; }
    .stat-value a { color: var(--accent-strong); }
    .tabs { display: flex; gap: 7px; margin: 18px 0 9px; }
    .tabs button[aria-selected="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
    pre { height: 215px; overflow: auto; margin: 0; padding: 14px; border-radius: 9px; background: var(--terminal); color: var(--terminal-text); font: 12.5px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .chart { padding: 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-alt); }
    .chart-label { color: var(--muted); font-size: 12px; }
    svg { display: block; width: 100%; height: 58px; margin-top: 5px; }
    .table-wrap { overflow-x: auto; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; }
    .empty { padding: 26px 8px; text-align: center; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
    @media (max-width: 520px) { .header { align-items: flex-start; flex-wrap: wrap; } .connection { order: 3; width: 100%; } .stats, .charts { grid-template-columns: 1fr; } .stages { font-size: 11px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="brand">CloudForge</h1>
      <span id="connection" class="connection">Connecting…</span>
      <span class="spacer"></span>
      <button id="themeButton" type="button">Toggle theme</button>
    </header>

    <div class="layout">
      <aside class="stack">
        <section class="card">
          <h2 class="card-title">Deploy a repository</h2>
          <form id="deployForm" novalidate>
            <label>GitHub repository URL
              <input id="repoUrl" type="url" placeholder="https://github.com/owner/repository" autocomplete="off" required>
            </label>
            <label>Branch
              <input id="branch" value="main" autocomplete="off">
            </label>
            <div id="formError" class="error" role="alert"></div>
            <button class="primary" type="submit">Deploy repository</button>
            <div class="hint">Use a repository name containing “broken” to simulate a failed build.</div>
          </form>
        </section>
        <section class="card">
          <h2 class="card-title">Applications</h2>
          <div id="applications" class="app-list"></div>
        </section>
      </aside>

      <section id="details" class="card" aria-live="polite"></section>
    </div>
  </main>

  <script>
    "use strict";

    const API = "http://localhost:8000/api/v1/apps";
    const STAGES = ["QUEUED", "BUILDING", "STARTING", "HEALTHY"];
    const state = { apps: [], selectedId: null, tab: "build", lastJson: "" };
    const $ = selector => document.querySelector(selector);
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    }[char]));

    function parseRepository(value) {
      let url;
      try { url = new URL(value.trim()); } catch { return { error: "Enter a valid GitHub URL." }; }
      if (url.protocol !== "https:") return { error: "Only HTTPS URLs are allowed." };
      if (url.hostname !== "github.com") return { error: "Only github.com repositories are supported." };
      const parts = url.pathname.replace(/\.git$/, "").split("/").filter(Boolean);
      if (parts.length !== 2 || parts.some(part => !/^[A-Za-z0-9._-]+$/.test(part))) {
        return { error: "URL must look like github.com/owner/repository." };
      }
      return { owner: parts[0], repo: parts[1] };
    }

    async function request(path = "", options = {}) {
      const response = await fetch(API + path, {
        headers: { "Content-Type": "application/json" }, ...options
      });
      if (response.status === 204) return null;
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const detail = data.detail;
        throw new Error(typeof detail === "string" ? detail : detail?.[0]?.msg || `Request failed (${response.status})`);
      }
      return data;
    }

    function setConnection(online) {
      const element = $("#connection");
      element.textContent = online ? "● Connected" : "● API offline — start the backend";
      element.className = `connection ${online ? "online" : "offline"}`;
    }

    async function refresh() {
      try {
        const apps = await request();
        setConnection(true);
        if (!apps.some(app => app.id === state.selectedId)) state.selectedId = apps[0]?.id ?? null;
        const json = JSON.stringify(apps);
        if (json !== state.lastJson) { state.apps = apps; state.lastJson = json; render(); }
      } catch { setConnection(false); }
    }

    function uptime(app) {
      if (!app.startedAt) return "—";
      const seconds = Math.floor((Date.now() - app.startedAt) / 1000);
      return seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
    }

    function sparkline(values = [], max = 100) {
      if (values.length < 2) return "<svg viewBox='0 0 100 40' aria-hidden='true'></svg>";
      const points = values.map((value, index) => `${(index / (values.length - 1)) * 100},${40 - (value / max) * 38}`).join(" ");
      return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" role="img" aria-label="Metric trend"><polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="1.8" vector-effect="non-scaling-stroke"></polyline></svg>`;
    }

    function renderApplications() {
      $("#applications").innerHTML = state.apps.length ? state.apps.map(app => `
        <button class="app" type="button" aria-current="${app.id === state.selectedId}" data-id="${app.id}">
          <span class="dot ${escapeHtml(app.status)}"></span>
          <span><span class="app-name">${escapeHtml(app.repo)}</span><span class="app-meta">${escapeHtml(app.owner)} · ${escapeHtml(app.status)}</span></span>
        </button>`).join("") : `<div class="empty">No applications yet. Add a GitHub repository to begin.</div>`;
      document.querySelectorAll(".app").forEach(button => button.onclick = () => { state.selectedId = Number(button.dataset.id); render(); });
    }

    function renderDetails() {
      const app = state.apps.find(item => item.id === state.selectedId);
      const details = $("#details");
      if (!app) { details.innerHTML = `<div class="empty">Select an application to view its deployment details.</div>`; return; }
      const deployment = app.deployments[0];
      const currentIndex = STAGES.indexOf(deployment.state);
      const stages = STAGES.map((stage, index) => {
        let className = "";
        if (deployment.state === "FAILED") className = index === 1 ? "failed" : index < 1 ? "done" : "";
        else if (app.status === "STOPPED" || index < currentIndex || deployment.state === "HEALTHY") className = "done";
        else if (index === currentIndex) className = "current";
        return `<span class="stage ${className}">${deployment.state === "FAILED" && stage === "BUILDING" ? "FAILED" : stage}</span>`;
      }).join("");
      const logs = state.tab === "build" ? deployment.build.map(line => escapeHtml(line.m)).join("\n") : deployment.runtime.map(line => escapeHtml(line.m)).join("\n") || "No runtime logs yet.";
      const isLive = app.status === "HEALTHY";

      details.innerHTML = `
        <div class="detail-head"><h2>${escapeHtml(app.owner)}/${escapeHtml(app.repo)}</h2><span class="status ${escapeHtml(app.status)}">${escapeHtml(app.status)}</span></div>
        <div class="stages" aria-label="Deployment progress">${stages}</div>
        <div class="stats">
          <div class="stat"><span class="stat-label">URL</span><span class="stat-value">${isLive ? `<a href="http://${escapeHtml(app.slug)}.localhost" target="_blank" rel="noopener">${escapeHtml(app.slug)}.localhost</a>` : "Not live"}</span></div>
          <div class="stat"><span class="stat-label">Commit</span><span class="stat-value">${escapeHtml(deployment.commit)} (${escapeHtml(deployment.branch)})</span></div>
          <div class="stat"><span class="stat-label">Uptime</span><span class="stat-value">${uptime(app)}</span></div>
        </div>
        <div class="button-row">
          <button data-action="redeploy" ${app.busy ? "disabled" : ""}>Redeploy</button>
          <button data-action="restart" ${app.status !== "HEALTHY" ? "disabled" : ""}>Restart</button>
          <button data-action="stop" ${app.status !== "HEALTHY" ? "disabled" : ""}>Stop</button>
          <button class="danger" data-action="delete" ${app.busy ? "disabled" : ""}>Delete</button>
        </div>
        <div class="tabs" role="tablist"><button role="tab" aria-selected="${state.tab === "build"}" data-tab="build">Build logs</button><button role="tab" aria-selected="${state.tab === "runtime"}" data-tab="runtime">Runtime logs</button></div>
        <pre id="log" tabindex="0">${logs || "Waiting for output…"}</pre>
        <div class="charts"><div class="chart"><span class="chart-label">CPU usage (simulated)</span>${sparkline(app.cpu, 20)}</div><div class="chart"><span class="chart-label">Memory usage (simulated)</span>${sparkline(app.mem, 128)}</div></div>
        <h2 class="card-title" style="margin-top:20px">Deployment history</h2>
        <div class="table-wrap"><table><thead><tr><th>#</th><th>Commit</th><th>Status</th><th>Started</th></tr></thead><tbody>${app.deployments.map(item => `<tr><td>${item.n}</td><td>${escapeHtml(item.commit)}</td><td><span class="status ${escapeHtml(item.state)}">${escapeHtml(item.state)}</span></td><td>${escapeHtml(item.created)}</td></tr>`).join("")}</tbody></table></div>`;

      $("#log").scrollTop = $("#log").scrollHeight;
      details.querySelectorAll("[data-tab]").forEach(button => button.onclick = () => { state.tab = button.dataset.tab; renderDetails(); });
      details.querySelectorAll("[data-action]").forEach(button => button.onclick = () => performAction(app, button.dataset.action));
    }

    function render() { renderApplications(); renderDetails(); }

    async function performAction(app, action) {
      if (action === "delete" && !confirm(`Delete ${app.owner}/${app.repo}? This removes its history.`)) return;
      try { await request(action === "delete" ? `/${app.id}` : `/${app.id}/${action}`, { method: action === "delete" ? "DELETE" : "POST" }); }
      catch (error) { alert(error.message); }
      state.lastJson = ""; await refresh();
    }

    $("#themeButton").onclick = () => {
      const root = document.documentElement;
      const isDark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
      root.dataset.theme = isDark ? "light" : "dark";
    };

    $("#deployForm").onsubmit = async event => {
      event.preventDefault();
      const url = $("#repoUrl").value.trim();
      const branch = $("#branch").value.trim() || "main";
      const repository = parseRepository(url);
      if (repository.error) { $("#formError").textContent = repository.error; return; }
      $("#formError").textContent = "";
      try {
        const app = await request("", { method: "POST", body: JSON.stringify({ url, branch }) });
        state.selectedId = app.id; state.lastJson = ""; await refresh(); event.target.reset(); $("#branch").value = "main";
      } catch (error) { $("#formError").textContent = error.message; }
    };

    render();
    refresh();
    setInterval(refresh, 1000);
    setInterval(() => { if (state.apps.find(app => app.id === state.selectedId)?.status === "HEALTHY") renderDetails(); }, 1000);
  </script>
</body>
</html>
