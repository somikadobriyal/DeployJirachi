<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CloudForge Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>CloudForge</h1>
    <span class="badge" id="conn">Connecting…</span>
    <span class="sp"></span>
    <button id="theme" type="button">Toggle theme</button>
  </header>
  <div class="stats" id="stats"></div>
  <div class="grid">
    <section>
      <div class="panel" style="margin-bottom:16px">
        <h2>Deploy a repository</h2>
        <form id="form" novalidate>
          <label>GitHub repository URL
            <input id="url" placeholder="https://github.com/you/hello-ok" autocomplete="off" spellcheck="false">
          </label>
          <label>Branch
            <input id="branch" value="main" autocomplete="off" spellcheck="false">
          </label>
          <div class="err" id="err" role="alert"></div>
          <button class="primary" type="submit">Deploy</button>
          <div class="hint">Try a repo named <code>hello-broken</code> to see a failed build.</div>
        </form>
      </div>
      <div class="panel">
        <h2>Applications</h2>
        <div id="apps"></div>
      </div>
    </section>
    <section class="panel" id="detail"></section>
  </div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
